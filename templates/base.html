{% load static %}
<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fc">
    <meta name="description" content="Portfolio of Suyog Bhandari, a BIT student and aspiring full-stack developer building web applications and exploring modern development technologies.">
    <meta property="og:title" content="Suyog Bhandari - Developer Portfolio">
    <meta property="og:description" content="Learning, building, and experimenting with web development in Kathmandu, Nepal.">
    <title>{% block title %}Suyog Bhandari - Developer Portfolio{% endblock %}</title>
    <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% block content %}{% endblock %}
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
